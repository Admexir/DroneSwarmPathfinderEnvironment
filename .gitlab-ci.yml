image: registry.hub.docker.com/kliberf/mff-nprg038-image

# Generic rules: do not re-run anything when adding a tag
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

stages:
  - review

# Fetch the most up-to-date definition from tests repository
include:
  - remote: 'https://gitlab.mff.cuni.cz/teaching/nprg035/merge-request-bot/-/raw/master/ci.yml'
